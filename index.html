<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaan ♥ Nisa</title>
  <meta name="description" content="Kaan ♥ Nisa — parametrik kalp animasyonu" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .wrapper {
      position: relative;
      width: min(700px, 95vmin);
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
    }

    /* Both canvases overlap perfectly */
    .wrapper canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Text canvas is on top, pointer-events ignored */
    #t { pointer-events: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="c"></canvas>  <!-- kalp çizgileri -->
    <canvas id="t"></canvas>  <!-- sadece metin -->
  </div>

  <script>
    // ── Heart canvas (strokes accumulate here) ────────────────────
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    // ── Text canvas (cleared + redrawn every frame — no buildup) ─
    const tCanvas = document.getElementById('t');
    const tCtx    = tCanvas.getContext('2d');

    const W = 700, H = 700;
    canvas.width  = W;  canvas.height  = H;
    tCanvas.width = W;  tCanvas.height = H;

    const PI  = Math.PI;
    const rnd = (a, b) => Math.random() * (b - a) + a;

    function heart(a, scale) {
      const x =  16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
      return [x, y];
    }

    const CX = W / 2;
    const CY = H / 2 + 45;
    function tc(x, y) { return [CX + x, CY - y]; }

    // ── Build stroke list ─────────────────────────────────────────
    function buildStrokes() {
      const strokes = [];

      for (let i = 0; i < 10000; i++) {
        const a  = rnd(0, 2 * PI);
        const sc = rnd(0.5, 15.5);
        const [x, y] = heart(a, sc);
        const ang = Math.atan2(y, x) + rnd(-0.5, 0.5);
        const len = rnd(4, 14);
        strokes.push({
          x1: x,   y1: y,
          x2: x + len * Math.cos(ang),
          y2: y + len * Math.sin(ang),
          r: 255,
          g: Math.round(rnd(0.25, 0.55) * 255),
          b: Math.round(rnd(0.65, 0.85) * 255),
          w: rnd(0.5, 1.2)
        });
      }

      for (let i = 0; i < 3500; i++) {
        const a = rnd(0, 2 * PI);
        const [x, y] = heart(a, 16.0);
        const dx  = rnd(-2, 2), dy = rnd(-2, 2);
        const ang = Math.atan2(y, x) + rnd(-0.35, 0.35);
        const len = rnd(10, 32);
        strokes.push({
          x1: x + dx,  y1: y + dy,
          x2: x + len * Math.cos(ang),
          y2: y + len * Math.sin(ang),
          r: 255,
          g: Math.round(rnd(0.45, 0.75) * 255),
          b: Math.round(rnd(0.75, 0.95) * 255),
          w: rnd(0.4, 0.9)
        });
      }

      return strokes;
    }

    // ── Text label — drawn on separate transparent canvas ─────────
    // Canvas is fully cleared each frame so no shadow accumulation.
    const FONT_SIZE = Math.round(W * 0.052);   // ~36px
    const LABEL_Y   = CY - 16 * 13 - FONT_SIZE * 1.5; // above heart top
    const LABEL_X   = CX;

    function drawLabel(now) {
      tCtx.clearRect(0, 0, W, H);

      // Very subtle breathing pulse — barely noticeable
      const scale = 1 + 0.018 * Math.sin(now * 0.0012);

      tCtx.save();
      tCtx.translate(LABEL_X, LABEL_Y);
      tCtx.scale(scale, scale);
      tCtx.translate(-LABEL_X, -LABEL_Y);

      tCtx.textAlign    = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.font         = `300 ${FONT_SIZE}px "Georgia", serif`;
      tCtx.letterSpacing = '0.12em';

      // Single clean pass — no shadow, no glow, transparent background
      tCtx.fillStyle = 'rgba(255, 188, 200, 0.88)';
      tCtx.fillText('Kaan  \u2665  Nisa', LABEL_X, LABEL_Y);

      tCtx.restore();
    }

    // ── Animation loop ────────────────────────────────────────────
    const DURATION_MS = 60_000;
    let strokes = [], total = 0, startTs = 0;

    function nextCycle() {
      ctx.clearRect(0, 0, W, H);
      strokes = buildStrokes();
      total   = strokes.length;
      startTs = performance.now();
      requestAnimationFrame(draw);
    }

    function draw(now) {
      const elapsed = now - startTs;
      const target  = Math.min(Math.floor((elapsed / DURATION_MS) * total), total);

      for (let i = Math.max(0, window._cursor ?? 0); i < target; i++) {
        const s = strokes[i];
        const [sx, sy] = tc(s.x1, s.y1);
        const [ex, ey] = tc(s.x2, s.y2);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = `rgba(${s.r},${s.g},${s.b},0.82)`;
        ctx.lineWidth   = s.w;
        ctx.stroke();
      }
      window._cursor = target;

      // Redraw text on its own clean canvas
      drawLabel(now);

      if (target >= total) {
        window._cursor = 0;
        nextCycle();
      } else {
        requestAnimationFrame(draw);
      }
    }

    nextCycle();
  </script>
</body>
</html>
