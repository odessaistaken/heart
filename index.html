<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaan ♥ Nisa</title>
  <meta name="description" content="Kaan ♥ Nisa — parametrik kalp animasyonu" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh; /* mobile safe area */
      overflow: hidden;
    }

    /* Responsive wrapper — canvas fills this square */
    .wrapper {
      position: relative;
      width: min(700px, 95vmin);
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Text overlay — always on top, scales with wrapper */
    .label {
      position: absolute;
      /* Positioned just above the heart's highest point (~38% from top of canvas) */
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.45em;
      white-space: nowrap;
      pointer-events: none;

      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      /* clamp: small on tiny phones, grows with viewport */
      font-size: clamp(16px, 5.5vmin, 40px);
      letter-spacing: 0.18em;
      color: rgba(255, 175, 190, 0.92);
      text-shadow:
        0 0 18px rgba(255, 100, 130, 0.55),
        0 0 40px rgba(255, 70, 110, 0.25);
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="c"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = 700, H = 700;
    canvas.width  = W;
    canvas.height = H;

    const PI  = Math.PI;
    const rnd = (a, b) => Math.random() * (b - a) + a;

    function heart(a, scale) {
      const x =  16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
      return [x, y];
    }

    // Canvas transform: turtle coords → canvas coords (y-flip, centered)
    const CX = W / 2;
    const CY = H / 2 + 45;   // shift up slightly for heart asymmetry
    function tc(x, y) { return [CX + x, CY - y]; }

    // ── Build stroke list (exact mirror of the Python script) ──────
    function buildStrokes() {
      const strokes = [];

      // Phase 1 — inner fill: 10 000 strokes at random scales 0.5–15.5
      for (let i = 0; i < 10000; i++) {
        const a  = rnd(0, 2 * PI);
        const sc = rnd(0.5, 15.5);
        const [x, y] = heart(a, sc);
        const ang = Math.atan2(y, x) + rnd(-0.5, 0.5);
        const len = rnd(4, 14);
        strokes.push({
          x1: x,   y1: y,
          x2: x + len * Math.cos(ang),
          y2: y + len * Math.sin(ang),
          r: 255,
          g: Math.round(rnd(0.25, 0.55) * 255),
          b: Math.round(rnd(0.65, 0.85) * 255),
          w: rnd(0.5, 1.2)
        });
      }

      // Phase 2 — outline: 3 500 strokes at scale 16
      for (let i = 0; i < 3500; i++) {
        const a = rnd(0, 2 * PI);
        const [x, y] = heart(a, 16.0);
        const dx  = rnd(-2, 2), dy = rnd(-2, 2);
        const ang = Math.atan2(y, x) + rnd(-0.35, 0.35);
        const len = rnd(10, 32);
        strokes.push({
          x1: x + dx,  y1: y + dy,
          x2: x + len * Math.cos(ang),
          y2: y + len * Math.sin(ang),
          r: 255,
          g: Math.round(rnd(0.45, 0.75) * 255),
          b: Math.round(rnd(0.75, 0.95) * 255),
          w: rnd(0.4, 0.9)
        });
      }

      return strokes;
    }

    // ── Text label drawn on canvas ────────────────────────────────
    // Drawn every frame on top of strokes so it's always visible
    function drawLabel(t) {
      // Gentle pulse: scale between 1.0 and 1.04
      const pulse = 1 + 0.04 * Math.abs(Math.sin(t * 0.0008));

      const fontSize  = Math.round(W * 0.055);  // ~38px on 700px canvas
      const labelY    = CY - 16 * 13 - fontSize * 1.6; // above heart top
      const labelX    = CX;

      ctx.save();
      ctx.translate(labelX, labelY);
      ctx.scale(pulse, pulse);
      ctx.translate(-labelX, -labelY);

      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = `300 ${fontSize}px Georgia, serif`;

      // Glow
      ctx.shadowColor  = 'rgba(255, 100, 130, 0.7)';
      ctx.shadowBlur   = 18;
      ctx.fillStyle    = 'rgba(255, 185, 200, 0.95)';
      ctx.fillText('Kaan \u2665 Nisa', labelX, labelY);

      // Sharper second pass
      ctx.shadowBlur   = 6;
      ctx.fillStyle    = 'rgba(255, 200, 210, 1)';
      ctx.fillText('Kaan \u2665 Nisa', labelX, labelY);

      ctx.restore();
    }

    // ── Animation loop (time-based: exactly 60 seconds per cycle) ──
    const DURATION_MS = 60_000; // 1 minute per full draw cycle
    let strokes  = [];
    let total    = 0;
    let startTs  = 0;

    function nextCycle() {
      ctx.clearRect(0, 0, W, H);
      strokes = buildStrokes();
      total   = strokes.length; // 13 500
      startTs = performance.now();
      requestAnimationFrame(draw);
    }

    function draw(now) {
      const elapsed = now - startTs;
      // How many strokes should be visible by now?
      const target = Math.min(
        Math.floor((elapsed / DURATION_MS) * total),
        total
      );

      // Draw only the newly revealed strokes this frame
      for (let i = Math.max(0, window._cursor ?? 0); i < target; i++) {
        const s = strokes[i];
        const [sx, sy] = tc(s.x1, s.y1);
        const [ex, ey] = tc(s.x2, s.y2);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = `rgba(${s.r},${s.g},${s.b},0.82)`;
        ctx.lineWidth   = s.w;
        ctx.stroke();
      }
      window._cursor = target;

      // Always draw label on top
      drawLabel(now);

      if (target >= total) {
        // Cycle complete — restart
        window._cursor = 0;
        nextCycle();
      } else {
        requestAnimationFrame(draw);
      }
    }

    nextCycle();
  </script>
</body>
</html>
